services:
  - type: web
    name: encuesta-ignite-2026
    runtime: static
    buildCommand: echo "Static survey ready"
    staticPublishPath: ./public
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

