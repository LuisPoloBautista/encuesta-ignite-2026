services:
  - type: web
    name: encuesta-ignite-2026
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRODUCT_ADMIN_USER
        value: nicolas.ignite
      - key: PRODUCT_ADMIN_PASSWORD
        sync: false

