<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff6900">
  <meta name="description" content="Tu voz enciende lo que viene. Responde la Encuesta Anual de Satisfacción Ignite 2026.">
  <title>Tu voz enciende lo que viene · Ignite 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="question-bank.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="./" aria-label="Ignite Online, inicio">
      <img src="img/logo_ignite.png" alt="Ignite Online" width="1240" height="361">
    </a>
    <button class="save-state" type="button" id="save-state" aria-label="Estado del borrador">
      <span class="save-dot"></span><span>Borrador guardado</span>
    </button>
  </header>

  <main class="survey-shell">
    <aside class="journey" aria-label="Progreso de la encuesta">
      <div class="journey-copy">
        <span class="eyebrow">Su progreso</span>
        <strong id="progress-label">Comencemos</strong>
      </div>
      <div class="progress-track" aria-hidden="true">
        <span class="progress-fill" id="progress-bar"><span class="progress-walker">🚶‍➡️</span></span>
        <span class="progress-finish">🏆</span>
      </div>
      <span class="progress-number progress-goal" id="progress-number"><span aria-hidden="true">🏆</span><span><small>Meta</small><strong>120 USD</strong></span></span>
    </aside>

    <section class="form-card" aria-live="polite">
      <form id="survey-form" novalidate>
        <div id="step-stage"></div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <footer class="form-actions" id="form-actions">
          <button type="button" class="button button-ghost" id="back-button">
            <span aria-hidden="true">←</span> Anterior
          </button>
          <button type="button" class="button button-primary" id="next-button">
            Continuar <span aria-hidden="true">→</span>
          </button>
        </footer>
      </form>
    </section>

    <p class="privacy-note">Sus respuestas serán utilizadas por Ignite para mejorar sus productos, servicios y acompañamiento.</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
